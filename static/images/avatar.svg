<svg xmlns="http://www.w3.org/2000/svg" class="cartoon-avatar avatar-idle" viewBox="0 0 320 430" role="img" aria-labelledby="avatarTitle avatarDesc">
        <title id="avatarTitle">Animated professional full body avatar of Ravali</title>
